name: Build MSIX Sideload package

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        configuration: [Release]
        platform: [x64]

    runs-on: windows-latest

    env:
      Solution_Name: src\InternalsViewer.slnx
      Manifest_Path: src\InternalsViewer.UI.App\Package.appxmanifest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: '5.x'

    - name: Set the package version from the tag
      if: github.ref_type == 'tag'
      shell: pwsh
      run: |
        if ($env:GITHUB_REF_NAME -notmatch '^v?(\d+\.\d+\.\d+)(-.+)?$') {
          throw "Release tags need to be Major.Minor.Build such as v5.0.5 or v5.0.6-beta.1, got '$env:GITHUB_REF_NAME'"
        }

        $build = [int]$env:GITHUB_RUN_NUMBER

        if ($build -gt 65535) {
          throw "Run number $build is above 65535, the largest value for a package version part"
        }

        $version = "$($Matches[1]).$build"

        $manifest = Get-Content $env:Manifest_Path -Raw

        $identity = [regex]'(<Identity\b[^>]*?\bVersion=")[^"]*(")'

        if (-not $identity.IsMatch($manifest)) {
          throw "No Identity version found in $env:Manifest_Path"
        }

        $manifest = $identity.Replace($manifest, "`${1}$version`${2}", 1)

        Set-Content -Path $env:Manifest_Path -Value $manifest -NoNewline

        Write-Host "Package version $version"

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    - name: Decode the pfx
      shell: pwsh
      run: |
        $pfxCertBytes = [System.Convert]::FromBase64String("${{ secrets.BASE64_ENCODED_PFX }}")
        $pfxPath = Join-Path $env:RUNNER_TEMP "GitHubActionsWorkflow.pfx"
        [IO.File]::WriteAllBytes($pfxPath, $pfxCertBytes)
        "PFX_PATH=$pfxPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
    
    - name: Import certificate
      shell: pwsh
      run: |
        $securePassword = ConvertTo-SecureString "${{ secrets.PFX_PASSWORD }}" -AsPlainText -Force
        Import-PfxCertificate `
          -FilePath "$env:PFX_PATH" `
          -CertStoreLocation Cert:\CurrentUser\My `
          -Password $securePassword | Out-Null

    - name: Create the app package
      shell: pwsh
      run: |
        msbuild $env:Solution_Name `
          /p:Configuration=$env:Configuration `
          /p:Platform=$env:Platform `
          /p:UapAppxPackageBuildMode=$env:Appx_Package_Build_Mode `
          /p:AppxBundle=$env:Appx_Bundle `
          /p:PackageCertificateKeyFile="$env:PFX_PATH" `
          /p:PackageCertificatePassword="${{ secrets.PFX_PASSWORD }}" `
          /p:AppxPackageDir="$env:Appx_Package_Dir" `
          /p:GenerateAppxPackageOnBuild=true `
          /verbosity:quiet
      env:
        Appx_Bundle: Never
        Appx_Package_Build_Mode: SideloadOnly
        Appx_Package_Dir: ${{ github.workspace }}\Packages\
        Configuration: ${{ matrix.configuration }}
        Platform: ${{ matrix.platform }}
    
    - name: Remove the pfx
      shell: pwsh
      if: always()
      run: |
        if (Test-Path "$env:PFX_PATH") { Remove-Item "$env:PFX_PATH" -Force }
    
    - name: Upload MSIX package
      uses: actions/upload-artifact@v4
      with:
        name: msix-package-${{ matrix.platform }}
        path: Packages/**/*
        if-no-files-found: error
        
