name: Build MSIX Store package

on:
  workflow_call:
    inputs:
      version:
        description: 'Package version as Major.Minor.Build, for example 5.0.5. Defaults to the tag, then the manifest'
        type: string
        required: false
      commit:
        description: 'Submit for certification. Otherwise the submission is left as a draft in Partner Center'
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version as Major.Minor.Build, for example 5.0.5. Defaults to the tag, then the manifest'
        type: string
        required: false
      commit:
        description: 'Submit for certification. Otherwise the submission is left as a draft in Partner Center'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    env:
      Solution_Name: src\InternalsViewer.slnx
      Manifest_Path: src\InternalsViewer.UI.App\Package.appxmanifest
      Appx_Package_Dir: ${{ github.workspace }}\Packages\
      Configuration: Release
      Platform: x64

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Set the package version
      id: version
      shell: pwsh
      env:
        Requested_Version: ${{ inputs.version }}
      run: |
        $version = $env:Requested_Version

        if (-not $version -and $env:GITHUB_REF_TYPE -eq 'tag') {
          $version = $env:GITHUB_REF_NAME
        }

        $manifest = Get-Content $env:Manifest_Path -Raw

        $identity = [regex]'(<Identity\b[^>]*?\bVersion=")([^"]*)(")'

        if ($version) {
          $version = $version.TrimStart('v')

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Store versions are Major.Minor.Build, got '$version'"
          }

          $manifest = $identity.Replace($manifest, "`${1}$version.0`${3}", 1)

          Set-Content -Path $env:Manifest_Path -Value $manifest -NoNewline
        }

        $packageVersion = $identity.Match($manifest).Groups[2].Value

        if ($packageVersion -notmatch '^\d+\.\d+\.\d+\.0$') {
          throw "The Store needs the fourth version number to be 0, the manifest has '$packageVersion'"
        }

        Write-Host "Package version $packageVersion"

        "version=$packageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Restore the application
      run: msbuild $env:Solution_Name /t:Restore /p:Configuration=$env:Configuration

    - name: Create the Store upload package
      shell: pwsh
      run: |
        msbuild $env:Solution_Name `
          /p:Configuration=$env:Configuration `
          /p:Platform=$env:Platform `
          /p:UapAppxPackageBuildMode=StoreUpload `
          /p:AppxBundle=Always `
          /p:AppxBundlePlatforms=$env:Platform `
          /p:AppxPackageSigningEnabled=false `
          /p:GenerateTemporaryStoreCertificate=false `
          /p:AppxPackageDir="$env:Appx_Package_Dir" `
          /p:GenerateAppxPackageOnBuild=true `
          /verbosity:quiet

    - name: Upload the Store package
      uses: actions/upload-artifact@v4
      with:
        name: msix-store-upload
        path: Packages/*.msixupload
        if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    environment: microsoft-store
    timeout-minutes: 90

    concurrency:
      group: microsoft-store
      cancel-in-progress: false

    steps:
    - name: Download the Store package
      uses: actions/download-artifact@v4
      with:
        name: msix-store-upload
        path: upload

    - name: Setup Microsoft Store Developer CLI
      uses: microsoft/microsoft-store-apppublisher@v1.1

    - name: Configure Microsoft Store Developer CLI
      shell: pwsh
      env:
        Tenant_Id: ${{ secrets.AZURE_AD_TENANT_ID }}
        Seller_Id: ${{ secrets.SELLER_ID }}
        Client_Id: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
        Client_Secret: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      run: |
        msstore reconfigure --tenantId $env:Tenant_Id --sellerId $env:Seller_Id --clientId $env:Client_Id --clientSecret $env:Client_Secret

        if ($LASTEXITCODE -ne 0) {
          throw "msstore reconfigure failed with exit code $LASTEXITCODE"
        }

    - name: Submit to the Microsoft Store
      shell: pwsh
      env:
        Product_Id: ${{ vars.STORE_PRODUCT_ID }}
        Is_Committed: ${{ inputs.commit }}
        Package_Version: ${{ needs.build.outputs.version }}
      run: |
        if (-not $env:Product_Id) {
          throw "Set the STORE_PRODUCT_ID repository variable to the app's Store ID"
        }

        $uploads = @(Get-ChildItem upload -Filter *.msixupload)

        if ($uploads.Count -ne 1) {
          throw "Expected one .msixupload, found $($uploads.Count)"
        }

        $arguments = @($uploads[0].FullName, '--appId', $env:Product_Id)

        if ($env:Is_Committed -ne 'true') {
          $arguments += '--noCommit'
        }

        Write-Host "Submitting $($uploads[0].Name) ($env:Package_Version), committed: $env:Is_Committed"

        msstore publish @arguments

        if ($LASTEXITCODE -ne 0) {
          throw "msstore publish failed with exit code $LASTEXITCODE"
        }
