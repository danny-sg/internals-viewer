<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html;charset=utf-8" />
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0 2px 0 0;
            overflow: hidden;
        }

        .tracked-region {
            background-color: rgba(76, 175, 80, 0.25);
        }
    </style>
</head>
<body>
    <div id="container" style="width:100%;height:100%;"></div>

    <script src="http://monaco.localhost/vs/loader.js"></script>
    <script>
        require.config({ paths: { 'vs': 'http://monaco.localhost/vs' } });

        require(['vs/editor/editor.main'], function () {
            const editor = monaco.editor.create(document.getElementById('container'),
                {
                    value: '',
                    language: 'sql',
                    theme: 'vs-light',
                    fontSize: 13,
                    mouseWheelZoom: true,
                    fontFamily: "'Cascadia Code', 'Consolas', monospace",
                    fontLigatures: true,
                    glyphMargin: false,
                    minimap: {
                        enabled: false
                    },
                    overviewRulerLanes: 0,
                    automaticLayout: true,
                    scrollBeyondLastLine: false,
                    wordWrap: 'off',
                    lineNumbers: 'on',
                    suggestOnTriggerCharacters: true,
                    quickSuggestions: true,
                    contextmenu: true
                });

            let trackedRegion = null;

            function publishTrackedRange(rangeOrNull) {
                window.chrome.webview.postMessage(
                    JSON.stringify({ type: "trackedSelectionChanged", value: rangeOrNull })
                );
            }

            const decorations = editor.createDecorationsCollection();

            const hasSelection =
                editor.createContextKey(
                    "hasSelection",
                    false
                );

            const isTracking =
                editor.createContextKey(
                    "isTracking",
                    false
                );

            editor.addAction({
                id: "track-region",
                label: "Trace query selection",
                precondition: "hasSelection",
                contextMenuGroupId: "navigation",

                run: () => {
                    const model = editor.getModel();
                    const selection = editor.getSelection();

                    if (!selection || selection.isEmpty()) {
                        return;
                    }

                    const startChar =
                        model.getOffsetAt({
                            lineNumber: selection.startLineNumber,
                            column: selection.startColumn
                        });

                    const endChar =
                        model.getOffsetAt({
                            lineNumber: selection.endLineNumber,
                            column: selection.endColumn
                        });

                    trackedRegion = {
                        text: model.getValueInRange(selection),
                        lastStart: startChar,
                        lastEnd: endChar
                    };

                    isTracking.set(true);

                    renderTrackedRegion(selection);

                    window.chrome.webview.postMessage(
                        JSON.stringify({ type: 'trackedSelectionChanged', value: { start: startChar, end: endChar } })
                    );
                }
            });

            editor.addAction({
                id: "clear-tracked-region",
                label: "Clear query selection",
                precondition: "isTracking",
                contextMenuGroupId: "navigation",

                run: () => {
                    trackedRegion = null;

                    isTracking.set(false);

                    decorations.clear();

                    renderTrackedRegion(null);

                    window.chrome.webview.postMessage(
                        JSON.stringify({ type: 'trackedSelectionChanged', value: null })
                    );
                }
            });

            editor.onDidChangeModelContent((e) => {
                window.chrome.webview.postMessage(
                    JSON.stringify({ type: "contentChanged", value: editor.getValue() })
                );

                if (!trackedRegion) {
                    return;
                }

                const model = editor.getModel();
                const ranges = decorations.getRanges();
                const currentRange = ranges.length > 0 ? ranges[0] : null;

                if (!currentRange) {
                    trackedRegion = null;
                    isTracking.set(false);
                    decorations.clear();
                    publishTrackedRange(null);
                    return;
                }

                const currentText = model.getValueInRange(currentRange);

                if (currentText !== trackedRegion.text) {
                    trackedRegion = null;

                    isTracking.set(false);

                    decorations.clear();

                    publishTrackedRange(null);

                    return;
                }

                const start = model.getOffsetAt({
                    lineNumber: currentRange.startLineNumber,
                    column: currentRange.startColumn
                });

                const end = model.getOffsetAt({
                    lineNumber: currentRange.endLineNumber,
                    column: currentRange.endColumn
                });

                if (start !== trackedRegion.lastStart || end !== trackedRegion.lastEnd) {
                    trackedRegion.lastStart = start;

                    trackedRegion.lastEnd = end;

                    publishTrackedRange({ start, end });
                }
            });

            editor.onDidChangeCursorSelection(() => {
                const selection = editor.getSelection();
                const selectedText = selection && !selection.isEmpty()
                    ? editor.getModel().getValueInRange(selection)
                    : '';

                hasSelection.set(
                    !!selection &&
                    !selection.isEmpty()
                );

                window.chrome.webview.postMessage(
                    JSON.stringify({ type: 'selectionChanged', value: selectedText })
                );
            });

            // F5 runs the query. Captured at the window (capture phase) so it fires wherever focus is in the
            // page and preventDefault stops the WebView from reloading; the host handles the 'execute' message.
            window.addEventListener('keydown', (e) => {
                if (e.key === 'F5') {
                    e.preventDefault();
                    e.stopPropagation();
                    window.chrome.webview.postMessage(JSON.stringify({ type: 'execute' }));
                }
            }, true);

            window.setEditorValue = (val) => {
                if (editor.getValue() !== val) {
                    editor.setValue(val);
                }
            };

            // Font size persistence. mouseWheelZoom (Ctrl+wheel) changes the effective font size via the editor's
            // zoom level, so the effective size is read from fontInfo and reported to the host. Each editor loads
            // in a fresh page with zoom level 0, so applying a saved size as the base font reproduces it exactly.
            let lastFontSize = 13;

            window.setEditorFontSize = (n) => {
                lastFontSize = n;
                editor.updateOptions({ fontSize: n });
            };

            editor.onDidChangeConfiguration((e) => {
                if (!e.hasChanged(monaco.editor.EditorOption.fontInfo)) {
                    return;
                }

                const fontSize = editor.getOption(monaco.editor.EditorOption.fontInfo).fontSize;

                if (fontSize !== lastFontSize) {
                    lastFontSize = fontSize;
                    window.chrome.webview.postMessage(JSON.stringify({ type: 'fontSizeChanged', value: fontSize }));
                }
            });

            let completionProvider;

            window.setSqlSchema = (data) => {
                if (completionProvider) {
                    completionProvider.dispose();
                }

                completionProvider = monaco.languages.registerCompletionItemProvider('sql', {
                    triggerCharacters: ['.'],

                    provideCompletionItems: function (model, position) {
                        const word = model.getWordUntilPosition(position);

                        const range = {
                            startLineNumber: position.lineNumber,
                            endLineNumber: position.lineNumber,
                            startColumn: word.startColumn,
                            endColumn: word.endColumn
                        };

                        const textUntilPosition = model.getValueInRange({
                            startLineNumber: position.lineNumber,
                            startColumn: 1,
                            endLineNumber: position.lineNumber,
                            endColumn: word.startColumn
                        });

                        const suggestions = [];

                        // Two-part match: schema.table.
                        const twoPartMatch = textUntilPosition.match(/([a-zA-Z0-9_]+)\.([a-zA-Z0-9_]+)\.$/);

                        if (twoPartMatch) {
                            const schemaPrefix = twoPartMatch[1].toLowerCase();
                            const tablePrefix = twoPartMatch[2].toLowerCase();

                            const columns = data.columns.filter(c =>
                                c.schema.toLowerCase() === schemaPrefix &&
                                c.table.toLowerCase() === tablePrefix
                            );

                            columns.forEach(column => {
                                suggestions.push({
                                    label: column.name,
                                    kind: monaco.languages.CompletionItemKind.Field,
                                    insertText: column.name,
                                    detail: `Column (${twoPartMatch[1]}.${twoPartMatch[2]})`,
                                    range: range
                                });
                            });

                            return { suggestions: suggestions };
                        }

                        // One-part match: schema. or table.
                        const onePartMatch = textUntilPosition.match(/([a-zA-Z0-9_]+)\.$/);

                        if (onePartMatch) {
                            const prefix = onePartMatch[1].toLowerCase();

                            const schemaTables = data.tables.filter(t => t.schema.toLowerCase() === prefix);

                            if (schemaTables.length > 0) {
                                schemaTables.forEach(table => {
                                    suggestions.push({
                                        label: table.name,
                                        kind: monaco.languages.CompletionItemKind.Class,
                                        insertText: table.name,
                                        detail: `Table (${table.schema})`,
                                        range: range
                                    });
                                });

                                return { suggestions: suggestions };
                            }

                            const tableColumns = data.columns.filter(c => c.table.toLowerCase() === prefix);

                            tableColumns.forEach(column => {
                                suggestions.push({
                                    label: column.name,
                                    kind: monaco.languages.CompletionItemKind.Field,
                                    insertText: column.name,
                                    detail: `Column`,
                                    range: range
                                });
                            });

                            return { suggestions: suggestions };
                        }

                        // No dot context — suggest schemas and tables
                        if (data.schemas) {
                            data.schemas.forEach(schema => {
                                suggestions.push({
                                    label: schema.name,
                                    kind: monaco.languages.CompletionItemKind.Module,
                                    insertText: schema.name,
                                    detail: 'Schema',
                                    range: range
                                });
                            });
                        }

                        if (data.tables) {
                            data.tables.forEach(table => {
                                suggestions.push({
                                    label: table.name,
                                    kind: monaco.languages.CompletionItemKind.Class,
                                    insertText: table.name,
                                    detail: table.schema ? `Table (${table.schema})` : 'Table',
                                    range: range
                                });
                            });
                        }

                        return { suggestions: suggestions };
                    }
                });
            };

            function renderTrackedRegion(range) {
                if (!trackedRegion || !range) {
                    decorations.clear();
                    return;
                }

                decorations.set([
                    {
                        range: range,
                        options: {
                            className: "tracked-region",
                            hoverMessage: {
                                value: "Selected query to trace"
                            },
                        }
                    }
                ]);
            }


            window._editorReady = true;
            window.chrome.webview.postMessage(JSON.stringify({ type: 'ready' }));
        });
    </script>
</body>
</html>
